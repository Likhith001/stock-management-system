{% extends 'base.html' %}
{% block content %}

<h2>Add / Edit Product</h2>
<hr>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
